# Static musl build target for x86_64.
# Prerequisites:
#   rustup target add x86_64-unknown-linux-musl
#   sudo pacman -S musl  (or equivalent)
#
# Build: cargo build --release --target x86_64-unknown-linux-musl
#
# Note: resonance-dsp, resonance-preset, resonance-ipc, resonance-cli,
# and resonance-tui are fully static (pure Rust + C via musl libc).
# resonance-daemon links to libpipewire which loads plugins at runtime
# and cannot be fully static; it will dynamically link libpipewire.so.
[target.x86_64-unknown-linux-musl]
linker = "x86_64-linux-musl-gcc"

# AArch64 (e.g. Raspberry Pi, ARM servers)
# Prerequisites: sudo pacman -S aarch64-linux-musl-gcc (or cross)
# [target.aarch64-unknown-linux-musl]
# linker = "aarch64-linux-musl-gcc"
