name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build release binaries
    # 24.04 is the floor: the libspa 0.10 crate needs PipeWire 1.x dev headers,
    # which 22.04 (pipewire 0.3.48) lacks. Sets a glibc 2.39 runtime floor.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --all

      - name: Package tarball
        run: |
          ver="${GITHUB_REF_NAME#v}"
          name="resonance-${ver}-x86_64-linux"
          mkdir -p "dist/$name"
          cp target/release/resonanced \
             target/release/resonance \
             target/release/resonance-tui \
             target/release/resonance-gui \
             "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )

      - name: Stamp -bin PKGBUILD with the built tarball checksum
        run: |
          # The prebuilt AUR PKGBUILD must carry the sha256 of *this* release's
          # tarball. We can't know it until the tarball is built, so generate the
          # final PKGBUILD here and ship it as a release asset; install.sh pulls
          # it from the release (not the tag tree), keeping the two in lockstep.
          ver="${GITHUB_REF_NAME#v}"
          name="resonance-${ver}-x86_64-linux"
          sha="$(awk '{print $1}' "dist/$name.tar.gz.sha256")"
          cp contrib/aur-bin/PKGBUILD dist/PKGBUILD
          # pkgver must match this release tag (it drives the download URL); the
          # in-repo PKGBUILD is just a template, the tag is the source of truth.
          sed -i "s/^pkgver=.*/pkgver=$ver/" dist/PKGBUILD
          # Replace the first quoted 64-hex (sha256sums[0] = the tarball) only.
          sed -i "0,/'[0-9a-f]\{64\}'/s//'$sha'/" dist/PKGBUILD
          echo "stamped pkgver $ver + tarball sha256 $sha into dist/PKGBUILD"
          grep -nE "^pkgver=|$sha" dist/PKGBUILD

      - name: Build RPM
        run: |
          cargo install --locked cargo-generate-rpm
          cargo generate-rpm -p crates/resonance-daemon
          cp target/generate-rpm/*.rpm dist/
          ( cd dist && for f in *.rpm; do sha256sum "$f" > "$f.sha256"; done )

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.sha256
            dist/PKGBUILD
          retention-days: 1

  build-macos:
    name: Build macOS .app bundle (arm64)
    strategy:
      matrix:
        # arm64 = Apple Silicon (macos-14 runner). Intel x86_64 dropped —
        # GitHub's macos-13 Intel runners are slow to provision and the
        # vast majority of macOS users are on Apple Silicon now.
        include:
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build .app bundle
        run: |
          # build-app.sh runs `cargo build --release -p resonance-daemon`
          # then bundles all four binaries + icns into Resonance.app and
          # ad-hoc codesigns with the entitlements TCC needs.
          contrib/macos/build-app.sh

      - name: Package tarball
        run: |
          ver="${GITHUB_REF_NAME#v}"
          name="resonance-${ver}-${{ matrix.arch }}-macos"
          mkdir -p "dist/$name"
          cp -R Resonance.app "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-dist
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: [build, build-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.sha256
            dist/PKGBUILD
