name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build release binaries
    # 24.04 is the floor: the libspa 0.10 crate needs PipeWire 1.x dev headers,
    # which 22.04 (pipewire 0.3.48) lacks. Sets a glibc 2.39 runtime floor.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --all

      - name: Package tarball
        run: |
          ver="${GITHUB_REF_NAME#v}"
          name="resonance-${ver}-x86_64-linux"
          mkdir -p "dist/$name"
          cp target/release/resonanced \
             target/release/resonance \
             target/release/resonance-tui \
             target/release/resonance-gui \
             "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
