[workspace]
resolver = "2"
members = [
    "crates/resonance-dsp",
    "crates/resonance-preset",
    "crates/resonance-ipc",
    "crates/resonance-daemon",
    "crates/resonance-cli",
    "crates/resonance-tui",
    "crates/resonance-gui",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/ealtun21/resonance"
rust-version = "1.85"

[workspace.dependencies]
# DSP
biquad = "0.6"
rustfft = "6"

# Serialization
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
toml = "1.1"

# Async / runtime
tokio = { version = "1", features = ["full"] }

# TUI
ratatui = "0.30"
crossterm = "0.29"

# GUI
# `persistence` lets eframe save egui memory (panel sizes, etc.) between runs.
eframe = { version = "0.34", features = ["persistence"] }
egui = "0.34"

# Audio / PipeWire
pipewire = "0.10"
spa = { version = "0.10", package = "libspa" }
spa-sys = { version = "0.10", package = "libspa-sys" }

# Real-time audio ring buffer (lock-free SPSC)
rtrb = "0.3"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4"

# HTTP (AutoEq download)
ureq = "3"

# Test utilities (dev only)
approx = "0.5"
criterion = "0.7"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
codegen-units = 1
