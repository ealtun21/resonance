[[scenario]]
id = "fx-all-dithered"
tier = "quick"
rates = [48000]
channels = [2]
# TPDF dither draws from its PRNG on every sample, including the idle cycles the
# live chain runs before the stimulus starts, so the live noise cannot line up
# with the render; 16-bit TPDF stays within ~6 LSB (-80 dBFS).
[scenario.expect]
compare = { tolerance_dbfs = -80 }
[scenario.profile]
dither_bits = 16
effects = { fidelity = 0.5, ambience = 0.5, surround = 0.5, dynamic_boost = 0.5, bass = 0.5, crossfeed = 0.5 }
