[package]
name = "resonance-cli"
description = "CLI client for the Resonance daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "resonance"
path = "src/main.rs"

[dependencies]
resonance-ipc = { path = "../resonance-ipc" }
clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
ureq = { workspace = true }
# `verify` harness: tone generation (hound), FFT analysis (rustfft), baseline
# JSON (serde/serde_json). All pure Rust — keeps the musl static build working.
hound = { workspace = true }
rustfft = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

# EPIPE handling: restore the default SIGPIPE disposition so piped output
# (`status | head`) exits quietly instead of panicking.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# `verify` on Windows: the daemon owns no audio path there (the APO does), so
# the harness plays its tone and captures the post-APO result itself via
# WASAPI (cpal output stream + loopback capture on the same endpoint).
[target.'cfg(windows)'.dependencies]
cpal = { workspace = true }
