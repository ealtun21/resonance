[package]
name = "resonance-daemon"
description = "PipeWire filter node daemon with Unix socket IPC server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "resonanced"
path = "src/main.rs"

[dependencies]
resonance-dsp = { path = "../resonance-dsp" }
resonance-preset = { path = "../resonance-preset" }
resonance-ipc = { path = "../resonance-ipc" }
pipewire = { workspace = true }
pipewire-sys = "0.10"
spa = { workspace = true }
spa-sys = { workspace = true }
rtrb = { workspace = true }
rustfft = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
postcard = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# ── RPM packaging (cargo-generate-rpm) ───────────────────────────────────────
# Build with `cargo build --release --all` first, then from the repo root:
#   cargo generate-rpm -p crates/resonance-daemon
# Asset source paths are resolved relative to the repo root.
[package.metadata.generate-rpm]
name = "resonance"
summary = "Terminal/desktop EQ daemon for PipeWire with FxSound and EqualizerAPO presets"
assets = [
    { source = "target/release/resonanced", dest = "/usr/bin/resonanced", mode = "755" },
    { source = "target/release/resonance", dest = "/usr/bin/resonance", mode = "755" },
    { source = "target/release/resonance-tui", dest = "/usr/bin/resonance-tui", mode = "755" },
    { source = "target/release/resonance-gui", dest = "/usr/bin/resonance-gui", mode = "755" },
    { source = "contrib/io.github.ealtun21.Resonance.desktop", dest = "/usr/share/applications/io.github.ealtun21.Resonance.desktop", mode = "644" },
    { source = "contrib/io.github.ealtun21.Resonance.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.ealtun21.Resonance.svg", mode = "644" },
    { source = "contrib/io.github.ealtun21.Resonance.metainfo.xml", dest = "/usr/share/metainfo/io.github.ealtun21.Resonance.metainfo.xml", mode = "644" },
    { source = "contrib/systemd/resonanced.service", dest = "/usr/lib/systemd/user/resonanced.service", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/resonance/LICENSE", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/resonance/README.md", mode = "644" },
]

[package.metadata.generate-rpm.requires]
pipewire = "*"
