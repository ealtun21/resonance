[package]
name = "resonance-gui"
description = "GUI client for the Resonance daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "resonance-gui"
path = "src/main.rs"

[dependencies]
resonance-ipc = { path = "../resonance-ipc" }
resonance-dsp = { path = "../resonance-dsp" }
resonance-preset = { path = "../resonance-preset" }
# Shared reference/measurement state + squig.link downloader (UI-agnostic).
resonance-reference = { path = "../resonance-reference" }
# AutoEQ fit (LGPL-3.0 — Rust port of peqdb/autoeq-c; see that crate).
resonance-autoeq = { path = "../resonance-autoeq" }
eframe = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
# squig.link measurement downloader (background thread).
ureq = { workspace = true }
# PNG encoder, used only by the `--dump-iconset` build helper. The image
# crate is already pulled in transitively by eframe; depending on its
# `png` feature directly costs nothing in binary size.
image = { version = "0.25", default-features = false, features = ["png"] }

# macOS: reposition the native traffic-light buttons so they centre vertically in
# our (taller, unified) toolbar. Reuses the objc2 stack winit already compiles —
# no new crates are downloaded; we just enable the classes we message.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSResponder",
    "NSWindow",
    "NSView",
    "NSControl",
    "NSButton",
] }
