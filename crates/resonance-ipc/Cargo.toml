[package]
name = "resonance-ipc"
description = "Shared IPC protocol types for daemon-client communication"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
resonance-dsp = { path = "../resonance-dsp" }
serde = { workspace = true }
postcard = { workspace = true }
thiserror = { workspace = true }

# uid lookup (macOS launchd backend) + SIGTERM to the daemon pidfile
# (Linux XDG-autostart fallback backend).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# PID-liveness check for the single-instance guard (no flock on Windows).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[lints]
workspace = true
