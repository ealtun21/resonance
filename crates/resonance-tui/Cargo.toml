[package]
name = "resonance-tui"
description = "Ratatui TUI client for the Resonance daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "resonance-tui"
path = "src/main.rs"

[dependencies]
resonance-ipc = { path = "../resonance-ipc" }
resonance-dsp = { path = "../resonance-dsp" }
resonance-preset = { path = "../resonance-preset" }
# Shared reference/measurement state + squig.link downloader (UI-agnostic).
resonance-reference = { path = "../resonance-reference" }
# AutoEQ fit (LGPL-3.0 — Rust port of peqdb/autoeq-c; see that crate).
resonance-autoeq = { path = "../resonance-autoeq" }
ratatui = { workspace = true }
crossterm = { workspace = true }
serde = { workspace = true }
# Reference-overlay state is persisted as JSON (its PersistedReference has
# scalar fields after table-valued ones, which TOML can't serialise).
serde_json = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
